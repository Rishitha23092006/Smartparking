{% extends 'app/base.html' %}

{% block title %}Dashboard - Smart Parking{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1>Parking Dashboard</h1>
        <p>Monitor and manage parking slots</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-parking"></i> Parking Slots</h2>
            </div>
            <div class="card-body">
                <div id="slots-grid" class="slots-grid">
                    <!-- Slots will be loaded here -->
                </div>
                <div id="loading-spinner" class="loading-spinner" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i> Loading slots...
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-plus-circle"></i> Book Slot</h2>
            </div>
            <div class="card-body">
                <form id="booking-form" class="booking-form">
                    <div class="form-group">
                        <label for="vehicle-number">Vehicle Number</label>
                        <input type="text" id="vehicle-number" name="vehicle_number" required placeholder="Enter vehicle number">
                    </div>
                    <div class="form-group">
                        <label for="slot-select">Select Available Slot</label>
                        <select id="slot-select" name="slot_id" required>
                            <option value="">Choose a slot...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-parking"></i> Book Slot
                    </button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-sign-out-alt"></i> Release Slot</h2>
            </div>
            <div class="card-body">
                <form id="release-form" class="release-form">
                    <div class="form-group">
                        <label for="vehicle-select">Select Your Vehicle</label>
                        <select id="vehicle-select" name="vehicle_id" required>
                            <option value="">Choose your vehicle...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-sign-out-alt"></i> Release Slot
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'app/js/dashboard.js' %}"></script>
{% endblock %}
